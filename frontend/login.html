<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Travel Partner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <div class="auth-top">
          <div class="brand-mark">🧭</div>
          <div>
            <strong>Travel Partner</strong>
            <p class="auth-tagline">Sign in as a traveler or admin to continue.</p>
          </div>
        </div>
        <h1>Welcome back</h1>
        <p class="auth-intro">Log in to manage bookings, access your dashboard, and explore today.</p>
        <form id="loginForm">
          <label>
            Email
            <input type="email" id="email" required autocomplete="email" />
          </label>
          <label>
            Password
            <input type="password" id="password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="btn btn-primary">Continue</button>
          <p id="status" class="status-text"></p>
        </form>
        <div class="auth-footnote">
          <p>New to Travel Partner? <a href="register.html">Create an account</a>.</p>
          <p class="small-text">Admin registration requires a valid registration code.</p>
        </div>
      </section>
    </main>
    <script src="login.js"></script>
  </body>
</html>
